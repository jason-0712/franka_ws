services:
  dual_realsense:
    image: realsense_ros2:latest
    container_name: franka_dual_realsense
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - ./realsense_sensor_data.yaml:/config/realsense_sensor_data.yaml:ro
    environment:
      ROS_DOMAIN_ID: 30
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
    command:
      - bash
      - -lc
      - |
        source /opt/ros/humble/setup.bash
        ros2 launch realsense2_camera rs_launch.py \
          camera_namespace:=right \
          camera_name:=right_third_person_camera \
          serial_no:=_344522302659 \
          config_file:=/config/realsense_sensor_data.yaml \
          rgb_camera.color_profile:=1280x720x30 \
          enable_depth:=true \
          align_depth.enable:=true \
          enable_infra1:=false \
          enable_infra2:=false \
          enable_gyro:=false \
          enable_accel:=false &
        primary_pid=$$!
        sleep 4
        ros2 launch realsense2_camera rs_launch.py \
          camera_namespace:=right \
          camera_name:=right_wrist_camera \
          serial_no:=_351322301561 \
          config_file:=/config/realsense_sensor_data.yaml \
          rgb_camera.color_profile:=640x480x30 \
          enable_depth:=false \
          enable_infra1:=false \
          enable_infra2:=false \
          enable_gyro:=false \
          enable_accel:=false &
        wrist_pid=$$!
        cleanup() {
          kill "$$primary_pid" "$$wrist_pid" 2>/dev/null || true
          wait "$$primary_pid" "$$wrist_pid" 2>/dev/null || true
        }
        trap "cleanup; exit 0" TERM INT
        wait -n "$$primary_pid" "$$wrist_pid"
        status=$$?
        cleanup
        exit "$$status"
