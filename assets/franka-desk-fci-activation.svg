<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Franka Desk FCI activation click order</title>
  <desc id="desc">Annotated Franka Desk guide showing first click the Joints unlock switch, then the HKU robot tile, then Activate FCI. The right panel shows successful FCI ON and Run state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3b30"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1180" height="760" fill="#eff2f3"/>
  <rect x="0" y="0" width="1180" height="66" fill="#10272d"/>
  <circle cx="42" cy="33" r="17" fill="#fff"/>
  <text x="90" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">DESK</text>
  <text x="158" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9bb5be">WATCHMAN</text>
  <text x="272" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9bb5be">SETTINGS</text>
  <circle cx="812" cy="33" r="13" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="840" y="29" font-family="Arial, sans-serif" font-size="11" fill="#96adb5">Language</text>
  <text x="840" y="45" font-family="Arial, sans-serif" font-size="14" fill="#fff">EN - English</text>
  <line x1="930" y1="20" x2="930" y2="50" stroke="#426069"/>
  <rect x="956" y="28" width="22" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="990" y="30" font-family="Arial, sans-serif" font-size="13" fill="#88a7b0">172.16.0.2</text>
  <text x="990" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">HKU</text>
  <line x1="1065" y1="20" x2="1065" y2="50" stroke="#426069"/>
  <circle cx="1098" cy="29" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M1084 52 C1088 41, 1108 41, 1112 52" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1126" y="30" font-family="Arial, sans-serif" font-size="13" fill="#88a7b0">admin</text>
  <text x="1126" y="48" font-family="Arial, sans-serif" font-size="18" fill="#fff">franka</text>
  <rect x="0" y="66" width="812" height="628" fill="#fafafa"/>
  <text x="142" y="232" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#cbd3d6">Press + or add an app to create a task!</text>
  <rect x="812" y="66" width="16" height="628" fill="#37d8a3"/>
  <rect x="828" y="66" width="290" height="628" fill="#314a51"/>
  <rect x="842" y="80" width="264" height="170" rx="4" fill="#496069"/>
  <path d="M852 214 L944 130 L1100 188" fill="none" stroke="#dfe7e8" stroke-width="1.2"/>
  <path d="M852 178 L1100 178 M882 150 L1082 213 M918 130 L1038 230 M962 122 L978 244" fill="none" stroke="#dfe7e8" stroke-width="1.1" opacity="0.8"/>
  <g transform="translate(942 120) rotate(12)">
    <rect x="0" y="0" width="46" height="18" rx="7" fill="#e7ecee"/>
    <rect x="20" y="-18" width="18" height="52" rx="8" fill="#f4f7f8"/>
    <rect x="-10" y="12" width="18" height="54" rx="8" fill="#e5ebed"/>
    <rect x="42" y="12" width="18" height="54" rx="8" fill="#e5ebed"/>
    <circle cx="29" cy="-21" r="11" fill="#f8fafb"/>
  </g>
  <rect x="1000" y="217" width="96" height="24" rx="12" fill="#28464f"/>
  <circle cx="1012" cy="229" r="7" fill="#2ee5a1"/>
  <text x="1024" y="234" font-family="Arial, sans-serif" font-size="14" fill="#fff">Arm Connected</text>
  <rect x="842" y="258" width="264" height="50" rx="4" fill="#405a62"/>
  <text x="850" y="276" font-family="Arial, sans-serif" font-size="10" fill="#9db3ba">System</text>
  <text x="934" y="276" font-family="Arial, sans-serif" font-size="11" fill="#fff">Ready</text>
  <text x="850" y="293" font-family="Arial, sans-serif" font-size="10" fill="#9db3ba">Safety Scenario</text>
  <text x="934" y="293" font-family="Arial, sans-serif" font-size="11" fill="#fff">Work</text>
  <text x="850" y="306" font-family="Arial, sans-serif" font-size="10" fill="#9db3ba">FCI</text>
  <text x="934" y="306" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">ON</text>
  <rect x="842" y="316" width="264" height="40" rx="4" fill="#405a62"/>
  <text x="850" y="339" font-family="Arial, sans-serif" font-size="11" fill="#c9d5d8">X3.1</text>
  <text x="934" y="339" font-family="Arial, sans-serif" font-size="11" fill="#fff">Not Triggered</text>
  <line x1="842" y1="370" x2="1106" y2="370" stroke="#4d6870"/>
  <text x="842" y="404" font-family="Arial, sans-serif" font-size="20" fill="#fff">Automatic Execution</text>
  <rect x="1048" y="386" width="58" height="22" rx="11" fill="#36c99a"/>
  <text x="1077" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Execution</text>
  <rect x="842" y="430" width="264" height="38" rx="5" fill="#405a62"/>
  <text x="850" y="454" font-family="Arial, sans-serif" font-size="14" fill="#fff">Joints</text>
  <text x="978" y="454" font-family="Arial, sans-serif" font-size="12" fill="#fff">Unlocked</text>
  <rect x="1062" y="443" width="31" height="14" rx="7" fill="#266aa7"/>
  <circle cx="1084" cy="450" r="10" fill="#2c85dc"/>
  <rect x="842" y="477" width="264" height="38" rx="5" fill="#405a62"/>
  <text x="850" y="501" font-family="Arial, sans-serif" font-size="14" fill="#fff">End Effector</text>
  <text x="978" y="501" font-family="Arial, sans-serif" font-size="12" fill="#fff">Power On</text>
  <rect x="1062" y="490" width="31" height="14" rx="7" fill="#266aa7"/>
  <circle cx="1084" cy="497" r="10" fill="#2c85dc"/>
  <rect x="842" y="524" width="264" height="38" rx="5" fill="#405a62"/>
  <text x="850" y="548" font-family="Arial, sans-serif" font-size="14" fill="#fff">Franka Hand</text>
  <circle cx="923" cy="543" r="4" fill="#2ee5a1"/>
  <text x="931" y="548" font-family="Arial, sans-serif" font-size="12" fill="#2ee5a1">initialized</text>
  <rect x="1010" y="531" width="88" height="26" rx="4" fill="#287bd8"/>
  <text x="1054" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Reinitialize</text>
  <rect x="842" y="570" width="264" height="36" rx="5" fill="#317665"/>
  <text x="970" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#adc8c1">RUN YOUR TASK</text>
  <rect x="1126" y="84" width="34" height="34" rx="17" fill="#38545d"/>
  <text x="1143" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#b8c9ce">›</text>
  <rect x="1128" y="132" width="50" height="110" rx="4" fill="#233d45"/>
  <text x="1153" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">Mode</text>
  <text x="1153" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93a9b1">PROG</text>
  <rect x="1130" y="206" width="46" height="40" rx="4" fill="#34c596"/>
  <text x="1153" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">EXEC</text>
  <line x1="1129" y1="300" x2="1129" y2="330" stroke="#34d7a2" stroke-width="4"/>
  <text x="1144" y="320" font-family="Arial, sans-serif" font-size="13" fill="#fff">Run</text>
  <g filter="url(#shadow)">
    <rect x="40" y="94" width="330" height="96" rx="12" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  </g>
  <circle cx="84" cy="142" r="26" fill="#ff3b30"/>
  <text x="84" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">1</text>
  <text x="126" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10272d">Click the button beside Joints</text>
  <text x="126" y="158" font-family="Arial, sans-serif" font-size="15" fill="#52666d">This unlocks the joints before FCI activation.</text>
  <path d="M370 142 C566 164, 826 344, 1078 448" fill="none" stroke="#ff3b30" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="420" y="84" width="320" height="92" rx="12" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  </g>
  <circle cx="464" cy="130" r="26" fill="#ff3b30"/>
  <text x="464" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">2</text>
  <text x="506" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10272d">Click the HKU robot tile</text>
  <text x="506" y="148" font-family="Arial, sans-serif" font-size="15" fill="#52666d">Top bar, next to the robot IP.</text>
  <path d="M740 130 C842 98, 936 56, 1008 40" fill="none" stroke="#ff3b30" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="94" y="218" width="346" height="108" rx="12" fill="#fff" stroke="#ff3b30" stroke-width="4"/>
  </g>
  <circle cx="138" cy="272" r="26" fill="#ff3b30"/>
  <text x="138" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">3</text>
  <text x="180" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10272d">Click Activate FCI</text>
  <text x="180" y="286" font-family="Arial, sans-serif" font-size="15" fill="#52666d">Use the button/dialog from the robot tile.</text>
  <path d="M438 272 C646 318, 786 304, 930 304" fill="none" stroke="#ff3b30" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="78" y="522" width="360" height="114" rx="12" fill="#fff" stroke="#2dbf88" stroke-width="4"/>
  </g>
  <text x="258" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d6b4d">Successful state</text>
  <text x="258" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#314a51">The right panel should show:</text>
  <text x="258" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#314a51">System Ready, Safety Scenario Work, FCI ON</text>
  <text x="258" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#314a51">Mode is EXEC and the side state is Run.</text>
  <path d="M438 577 C612 530, 758 424, 932 304" fill="none" stroke="#2dbf88" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
