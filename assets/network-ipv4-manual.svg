<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu wired IPv4 manual network settings for Franka FCI</title>
  <desc id="desc">Annotated guide showing Manual IPv4 with address 172.16.0.1 and netmask 255.255.255.0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="920" height="700" fill="#f5f5f5"/>
  <g filter="url(#shadow)">
    <rect x="48" y="34" width="824" height="620" rx="10" fill="#fff"/>
  </g>
  <rect x="48" y="34" width="824" height="64" rx="10" fill="#fafafa"/>
  <rect x="56" y="42" width="96" height="44" rx="8" fill="#e0e0e0"/>
  <text x="104" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#444">Cancel</text>
  <text x="460" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#333">Wired</text>
  <rect x="774" y="42" width="80" height="44" rx="8" fill="#f05a28"/>
  <text x="814" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Apply</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#555">
    <text x="74" y="132">Details</text>
    <text x="172" y="132">Identity</text>
    <text x="286" y="132">IPv4</text>
    <text x="372" y="132">IPv6</text>
    <text x="472" y="132">Security</text>
  </g>
  <rect x="270" y="148" width="68" height="4" fill="#f05a28"/>
  <line x1="48" y1="154" x2="872" y2="154" stroke="#ddd"/>
  <text x="82" y="204" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#444">IPv4 Method</text>
  <circle cx="322" cy="198" r="11" fill="#fff" stroke="#ddd" stroke-width="3"/>
  <text x="342" y="204" font-family="Arial, sans-serif" font-size="18" fill="#555">Automatic (DHCP)</text>
  <circle cx="322" cy="238" r="12" fill="#f05a28"/>
  <circle cx="322" cy="238" r="5" fill="#fff"/>
  <text x="342" y="244" font-family="Arial, sans-serif" font-size="18" fill="#555">Manual</text>
  <circle cx="322" cy="278" r="11" fill="#fff" stroke="#ddd" stroke-width="3"/>
  <text x="342" y="284" font-family="Arial, sans-serif" font-size="18" fill="#555">Shared to other computers</text>
  <text x="82" y="352" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#444">Addresses</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#999">
    <text x="180" y="386">Address</text>
    <text x="438" y="386">Netmask</text>
    <text x="690" y="386">Gateway</text>
  </g>
  <rect x="82" y="398" width="756" height="42" rx="7" fill="#eee"/>
  <line x1="340" y1="398" x2="340" y2="440" stroke="#ddd"/>
  <line x1="576" y1="398" x2="576" y2="440" stroke="#ddd"/>
  <text x="96" y="426" font-family="Arial, sans-serif" font-size="18" fill="#444">172.16.0.1</text>
  <text x="354" y="426" font-family="Arial, sans-serif" font-size="18" fill="#444">255.255.255.0</text>
  <text x="82" y="525" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#444">DNS</text>
  <rect x="82" y="548" width="756" height="42" rx="7" fill="#eee"/>
  <text x="82" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#444">Routes</text>
  <path d="M 174 296 C 178 260, 210 236, 300 238" fill="none" stroke="#e53935" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="82" y="246" width="180" height="64" rx="10" fill="#fff" stroke="#e53935" stroke-width="3"/>
  <text x="172" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#e53935">1. Select Manual</text>
  <text x="172" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">not DHCP</text>
  <path d="M 262 472 C 218 452, 146 444, 112 432" fill="none" stroke="#e53935" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="236" y="466" width="208" height="72" rx="10" fill="#fff" stroke="#e53935" stroke-width="3"/>
  <text x="340" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#e53935">2. PC IP address</text>
  <text x="340" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">172.16.0.1</text>
  <path d="M 538 471 C 510 448, 438 440, 386 432" fill="none" stroke="#e53935" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="506" y="466" width="230" height="72" rx="10" fill="#fff" stroke="#e53935" stroke-width="3"/>
  <text x="621" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#e53935">3. Netmask</text>
  <text x="621" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">255.255.255.0</text>
  <path d="M 724 120 C 790 130, 820 88, 814 66" fill="none" stroke="#e53935" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="606" y="118" width="214" height="58" rx="10" fill="#fff" stroke="#e53935" stroke-width="3"/>
  <text x="713" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#e53935">4. Click Apply</text>
  <text x="713" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">then reconnect if needed</text>
</svg>
